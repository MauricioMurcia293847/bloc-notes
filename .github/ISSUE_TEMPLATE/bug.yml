name: Bug
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Después de crearlo, asígnale su **milestone** (etapa) y una etiqueta de **prioridad**.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el problema.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      value: |
        - [ ] El bug ya no se reproduce.
        - [ ] Hay un test que lo cubre (si aplica).
    validations:
      required: true

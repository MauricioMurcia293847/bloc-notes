name: bloc_notes
description: "Bloc, una aplicacion movil de notas tranquila y clara."
# Proyecto privado: evita publicarlo por accidente en pub.dev.
publish_to: 'none'

# Formato: versión visible (SemVer) + número de build (entero que crece en cada
# release). En Android equivalen a versionName y versionCode.
version: 1.0.10+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  supabase_flutter: ^2.15.1
  app_links: ^7.2.0
  image_picker: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
